# 既存の Apache に相乗りする vhost（HTTP）。最初の1回だけ手で入れる（DEPLOY.md）。
#
#   cp /opt/campus-info/deploy/apache/campus-info.lazyta-toru.net.conf /etc/apache2/sites-available/
#   a2ensite campus-info.lazyta-toru.net
#   apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d campus-info.lazyta-toru.net --redirect
#
# certbot が :443 の vhost（-le-ssl.conf）を作り、ここに :80 → :443 のリダイレクトを足す。
# 中身はコンテナへ渡すだけなので、以後デプロイでこのファイルを触ることはない。
# 127.0.0.1:3010 は compose.yaml の APP_PORT。変えたら両方そろえる。

<VirtualHost *:80>
    ServerName campus-info.lazyta-toru.net

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog  ${APACHE_LOG_DIR}/campus-info.lazyta-toru.net_error.log
    CustomLog ${APACHE_LOG_DIR}/campus-info.lazyta-toru.net_access.log combined
</VirtualHost>
